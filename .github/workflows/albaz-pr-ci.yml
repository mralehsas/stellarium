name: "ALBAZ Crescent PR CI"

on:
  pull_request:
    branches:
      - albaz/stellarium-26.2-ci-base

jobs:
  albaz-qt6:
    name: "ALBAZ Qt6 scientific tests"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout pull request
        uses: actions/checkout@v6

      - name: Install Qt6 and Stellarium build dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            qt6-base-private-dev qt6-multimedia-dev qt6-positioning-dev qt6-tools-dev qt6-tools-dev-tools qt6-base-dev-tools \
            qt6-qpa-plugins qt6-image-formats-plugins qt6-l10n-tools qt6-webengine-dev qt6-webengine-dev-tools libqt6charts6-dev \
            libqt6charts6 libqt6opengl6-dev libqt6positioning6-plugins libqt6serialport6-dev qt6-base-dev libqt6webenginecore6-bin \
            libqt6webengine6-data libexiv2-dev libnlopt-cxx-dev zlib1g-dev libgl1-mesa-dev libdrm-dev libglx-dev libxkbcommon-x11-dev \
            libgps-dev libmd4c-dev libmd4c-html0-dev cmake gettext libgettextpo-dev libtidy-dev libunarr-dev qt6-svg-dev libqt6svgwidgets6 \
            libqt6texttospeech6 qt6-speech-dev qt6-speech-speechd-plugin qt6-speech-flite-plugin flite speech-dispatcher

      - name: Configure Qt6 test build
        run: |
          cmake -S . -B build-albaz \
            -DENABLE_QT6=ON \
            -DENABLE_TESTING=ON \
            -DSTELLARIUM_RELEASE_BUILD=OFF \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo

      - name: Build ALBAZ scientific types test
        run: cmake --build build-albaz --target testALBAZScientificTypes -j2

      - name: Run ALBAZ scientific types test
        run: ctest --test-dir build-albaz -R testALBAZScientificTypes --output-on-failure
