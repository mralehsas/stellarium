name: "CI"

on:
  pull_request:
    branches:
      - albaz/stellarium-26.2-ci-base

jobs:
  albaz-qt6:
    name: "ALBAZ Qt6 scientific tests"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout ALBAZ scientific sources
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          sparse-checkout: |
            plugins/ALBAZCrescent/src/core
            plugins/ALBAZCrescent/src/test
          sparse-checkout-cone-mode: false

      - name: Install minimal Qt6 test toolchain
        run: |
          sudo apt update
          sudo apt install -y qt6-base-dev qt6-base-dev-tools pkg-config g++

      - name: Build ALBAZ scientific types test
        shell: bash
        run: |
          set -euo pipefail
          TEST_DIR="$GITHUB_WORKSPACE/plugins/ALBAZCrescent/src/test"
          MOC="$(qtpaths6 --query QT_HOST_LIBEXECS)/moc"
          "$MOC" "$TEST_DIR/testScientificTypes.hpp" -o "$RUNNER_TEMP/moc_testScientificTypes.cpp"
          g++ -std=c++17 -O2 -Wall -Wextra -pedantic \
            "$TEST_DIR/testScientificTypes.cpp" \
            "$RUNNER_TEMP/moc_testScientificTypes.cpp" \
            -I"$TEST_DIR" \
            $(pkg-config --cflags --libs Qt6Core Qt6Test) \
            -o "$RUNNER_TEMP/testALBAZScientificTypes"

      - name: Run ALBAZ scientific types test
        run: "$RUNNER_TEMP/testALBAZScientificTypes -txt"

      - name: Build ALBAZ time-calendar-angle test
        shell: bash
        run: |
          set -euo pipefail
          TEST_DIR="$GITHUB_WORKSPACE/plugins/ALBAZCrescent/src/test"
          MOC="$(qtpaths6 --query QT_HOST_LIBEXECS)/moc"
          "$MOC" "$TEST_DIR/testTimeCalendarAngles.hpp" -o "$RUNNER_TEMP/moc_testTimeCalendarAngles.cpp"
          g++ -std=c++17 -O2 -Wall -Wextra -pedantic \
            "$TEST_DIR/testTimeCalendarAngles.cpp" \
            "$RUNNER_TEMP/moc_testTimeCalendarAngles.cpp" \
            -I"$TEST_DIR" \
            $(pkg-config --cflags --libs Qt6Core Qt6Test) \
            -o "$RUNNER_TEMP/testALBAZTimeCalendarAngles"

      - name: Run ALBAZ time-calendar-angle test
        run: "$RUNNER_TEMP/testALBAZTimeCalendarAngles -txt"

  albaz-static-plugin-integration:
    name: "ALBAZ Stellarium static plugin integration"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Install Stellarium Qt6 integration dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            qt6-base-private-dev qt6-multimedia-dev qt6-positioning-dev qt6-tools-dev qt6-tools-dev-tools qt6-base-dev-tools \
            qt6-qpa-plugins qt6-image-formats-plugins qt6-l10n-tools qt6-webengine-dev qt6-webengine-dev-tools libqt6charts6-dev \
            libqt6charts6 libqt6opengl6-dev libqt6positioning6-plugins libqt6serialport6-dev qt6-base-dev libqt6webenginecore6-bin \
            libqt6webengine6-data libexiv2-dev libnlopt-cxx-dev zlib1g-dev libgl1-mesa-dev libdrm-dev libglx-dev libxkbcommon-x11-dev \
            libgps-dev libmd4c-dev libmd4c-html0-dev cmake gettext libgettextpo-dev libtidy-dev libunarr-dev qt6-svg-dev libqt6svgwidgets6 \
            libqt6texttospeech6 qt6-speech-dev qt6-speech-speechd-plugin qt6-speech-flite-plugin flite speech-dispatcher

      - name: Configure Stellarium integration build
        shell: bash
        run: |
          cmake -S . -B build-albaz-integration \
            -DENABLE_QT6=On \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DSTELLARIUM_RELEASE_BUILD=Off \
            -DENABLE_TESTING=On \
            -DENABLE_PCH=Off \
            -DENABLE_NLS=Off \
            -DENABLE_SHOWMYSKY=Off \
            -DENABLE_GPS=Off \
            -DENABLE_LIBGPS=Off \
            -DENABLE_MEDIA=Off \
            -DENABLE_XLSX=Off \
            -DENABLE_SCRIPTING=Off \
            -DENABLE_QTWEBENGINE=Off \
            -DUSE_PLUGIN_ANGLEMEASURE=Off \
            -DUSE_PLUGIN_ARCHAEOLINES=Off \
            -DUSE_PLUGIN_CALENDARS=Off \
            -DUSE_PLUGIN_EQUATIONOFTIME=Off \
            -DUSE_PLUGIN_EXOPLANETS=Off \
            -DUSE_PLUGIN_METEORSHOWERS=Off \
            -DUSE_PLUGIN_LENSDISTORTIONESTIMATOR=Off \
            -DUSE_PLUGIN_NEBULATEXTURES=Off \
            -DUSE_PLUGIN_NAVSTARS=Off \
            -DUSE_PLUGIN_NOVAE=Off \
            -DUSE_PLUGIN_OBSERVABILITY=Off \
            -DUSE_PLUGIN_OCULARS=Off \
            -DUSE_PLUGIN_ONLINEQUERIES=Off \
            -DUSE_PLUGIN_POINTERCOORDINATES=Off \
            -DUSE_PLUGIN_PULSARS=Off \
            -DUSE_PLUGIN_QUASARS=Off \
            -DUSE_PLUGIN_REMOTECONTROL=Off \
            -DUSE_PLUGIN_REMOTESYNC=Off \
            -DUSE_PLUGIN_SATELLITES=Off \
            -DUSE_PLUGIN_SCENERY3D=Off \
            -DUSE_PLUGIN_SOLARSYSTEMEDITOR=Off \
            -DUSE_PLUGIN_SUPERNOVAE=Off \
            -DUSE_PLUGIN_TELESCOPECONTROL=Off \
            -DUSE_PLUGIN_TEXTUSERINTERFACE=Off \
            -DUSE_PLUGIN_SKYCULTUREMAKER=Off \
            -DUSE_PLUGIN_ALBAZCRESCENT=On

      - name: Build ALBAZ plugin smoke test
        run: cmake --build build-albaz-integration --target testALBAZPluginSmoke -j2

      - name: Run ALBAZ plugin smoke test
        run: ctest --test-dir build-albaz-integration -R '^testALBAZPluginSmoke$' --output-on-failure
